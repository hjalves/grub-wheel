loadfont (memdisk)/boot/grub/fonts/terminus-32.pf2
insmod all_video
insmod gfxterm
terminal_output gfxterm
terminal_input console
insmod uhci
set usb_mouse=1
@SNIPPET@
set timeout=-1
menuentry "Entry one" { echo one }
menuentry "Entry two" { echo two }
menuentry "Entry three" { echo three }
menuentry "Entry four" { echo four }
menuentry "Show probe" { usb_mouse_probe; lsmod; sleep 1000 }
