insmod part_msdos
insmod ext2
set usb_mouse_result=start
save_env usb_mouse_result
echo "save1 rc=$?"
insmod ehci
insmod uhci
echo "ehci rc=$?"
set usb_mouse_result=after-ehci
save_env usb_mouse_result
echo "save2 rc=$?"
ls
insmod usb_mouse
usb_mouse_probe usb_mouse_result
save_env usb_mouse_result
echo "save3 rc=$?"
ls (hd0,msdos1)/boot/grub
cat (hd0,msdos1)/boot/grub/grubenv
sleep 1000
